name: Upstream Sync

# Merges simstudioai/sim main into the branch that triggered the run via the Sandcastle harness.
# Cron/dispatch default: batch of up to 6 upstream releases (`vX.Y.Z:` tips) per run —
# or fewer if that is all that remains — not all of main.
# After a successful complete, the harness dispatches another run if more releases remain
# (`gh workflow run upstream-sync.yml`; concurrency group `upstream-sync` serializes).
# Each batch opens a NEW stacked draft PR based on the previous tip (not reuse/extend).
# Tip-only landing: merge the tip into TARGET; lower stack PRs close as superseded.
# FORCE_RUN starts a fresh stack and closes open stack PRs.
# Smoke escapes: workflow_dispatch `until_sha` or positive `max_commits` (0 = release-batch default).
# Override batch size with `min_releases` / `UPSTREAM_SYNC_MIN_RELEASES` (default 6).
# Parent: grill writes a draft merge plan; resume skips re-ask but finalizes the plan post-merge,
# then Luna children run from merge-plan.json (prefix clustering is fallback only).
# Build is left to CI; check/lint stay advisory (test is also left to CI).
# After each successful complete, tip pointers are mirrored onto TARGET so the
# auto-chained next release stacks on the latest tip PR.
# Polls daily; resumes when a reviewer replies `/upstream-sync resume` on the draft PR.
# Note: issue_comment events only run workflows present on the repository default branch.
# While validating this workflow from a feature branch, use workflow_dispatch with resume=true.
#
# push: activates workflow_dispatch on feature branches (must run once before
# `gh workflow run upstream-sync.yml --ref <branch>` works off default branch).
#
# Repo Variables (Settings → Variables → Actions): UPSTREAM_REMOTE, UPSTREAM_REPO,
# UPSTREAM_BRANCH, UPSTREAM_SYNC_TARGET_BRANCH, UPSTREAM_SYNC_PR_REVIEWERS,
# UPSTREAM_SYNC_CLUSTER_MIN_SEGMENTS (default 4), UPSTREAM_SYNC_CLUSTER_MAX_FILES (12),
# UPSTREAM_SYNC_CLUSTER_MAX_DEPTH (5), UPSTREAM_SYNC_CLUSTER_MAX_DYNAMIC_ROUNDS (2).
# Secrets (Settings → Secrets → Actions): GH_PAT or UPSTREAM_SYNC_GH_TOKEN (classic
# ghp_* with `repo` + `workflow` scopes — required to push `.github/workflows/*`);
# ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN) / OPENAI_API_KEY when agents run.
# Note: Actions GITHUB_TOKEN can never push workflow file updates (platform rule).

on:
  push:
    branches:
      - feat/github-merge-agent
    paths:
      - '.github/workflows/upstream-sync.yml'
      - '.sandcastle/**'
      - '.upstream-sync/**'
      - 'package.json'
      - 'bun.lock'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run even when upstream SHA is unchanged
        type: boolean
        default: false
      resume:
        description: Resume an existing upstream-sync PR
        type: boolean
        default: false
      resume_pr:
        description: PR number to resume when using workflow_dispatch
        type: string
        required: false
      skip_agent:
        description: Skip Sandcastle agents (git merge + verify only)
        type: boolean
        default: false
      agent_provider:
        description: Agent mode — dual (Opus parent + Luna children), anthropic, or openai
        type: choice
        options:
          - dual
          - anthropic
          - openai
        default: dual
      max_commits:
        description: Positive integer caps commit count (smoke). 0 = release-batch default (min_releases)
        type: string
        default: '0'
      min_releases:
        description: Minimum upstream vX.Y.Z tips to merge per run (default 6, or fewer if that is all remaining)
        type: string
        default: '6'
      until_sha:
        description: Optional upstream SHA to merge through (overrides max_commits and release-batch default)
        type: string
        required: false
  issue_comment:
    types: [created]

concurrency:
  # Push only registers workflow_dispatch on the branch (gate exits should_run=false).
  # Keep those out of the harness group so a sandcastle fix push cannot queue behind /
  # visually freeze a live agent run.
  group: ${{ github.event_name == 'push' && format('upstream-sync-push-{0}', github.ref) || 'upstream-sync' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# write-all: sync pushes branches that may update workflows, create PRs/comments,
# request reviewers, and must not die mid-run on a missing GITHUB_TOKEN scope
# after agents have already spent tokens.
permissions: write-all

env:
  UPSTREAM_REMOTE: ${{ vars.UPSTREAM_REMOTE || 'upstream' }}
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'simstudioai/sim' }}
  UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'main' }}
  # TEMP fallback while validating on feat/github-merge-agent.
  # After merge to default: set repo var UPSTREAM_SYNC_TARGET_BRANCH=version-5-main.
  TARGET_BRANCH: ${{ vars.UPSTREAM_SYNC_TARGET_BRANCH || 'feat/github-merge-agent' }}
  # GitHub usernames (comma-separated). Set repo variable UPSTREAM_SYNC_PR_REVIEWERS
  # to the GitHub login for utcarsh.srivastava@position2.com (emails cannot be used).
  UPSTREAM_SYNC_PR_REVIEWERS: ${{ vars.UPSTREAM_SYNC_PR_REVIEWERS }}
  # Codex/`git`/`gh` must never block on `less` in CI (pager stall = silent hang).
  CI: 'true'
  PAGER: cat
  GIT_PAGER: cat
  GH_PAGER: cat
  MANPAGER: cat
  LESS: FRX
  GIT_TERMINAL_PROMPT: '0'
  UPSTREAM_SYNC_CHILD_IDLE_TIMEOUT_SECONDS: '1800'
  UPSTREAM_SYNC_IDLE_TIMEOUT_SECONDS: '3600'

jobs:
  gate:
    name: Should run
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      resume: ${{ steps.decide.outputs.resume }}
      force: ${{ steps.decide.outputs.force }}
      skip_agent: ${{ steps.decide.outputs.skip_agent }}
      agent_provider: ${{ steps.decide.outputs.agent_provider }}
      max_commits: ${{ steps.decide.outputs.max_commits }}
      min_releases: ${{ steps.decide.outputs.min_releases }}
      until_sha: ${{ steps.decide.outputs.until_sha }}
      # 0 max_commits → harness release-batch default (min_releases, default 6)
    steps:
      - name: Decide trigger
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          resume=false
          force=false
          skip_agent=true
          agent_provider=dual
          # 0 = release-batch default (min_releases). Positive = smoke commit cap.
          max_commits=0
          min_releases=6
          until_sha=

          if [ "$EVENT" = "workflow_dispatch" ]; then
            force="${{ github.event.inputs.force == 'true' && 'true' || 'false' }}"
            resume="${{ github.event.inputs.resume == 'true' && 'true' || 'false' }}"
            skip_agent="${{ github.event.inputs.skip_agent == 'true' && 'true' || 'false' }}"
            agent_provider="${{ github.event.inputs.agent_provider || 'dual' }}"
            max_commits="${{ github.event.inputs.max_commits || '0' }}"
            min_releases="${{ github.event.inputs.min_releases || '6' }}"
            until_sha="${{ github.event.inputs.until_sha || '' }}"
          fi

          if [ "$EVENT" = "issue_comment" ]; then
            if echo "$COMMENT" | grep -q '/upstream-sync resume'; then
              resume=true
              skip_agent=false
              should_run=true
            else
              should_run=false
            fi
          elif [ "$EVENT" = "push" ]; then
            # Push only registers workflow_dispatch on the branch. Do not auto-merge on push —
            # that raced resume runs and used skip_agent=true dry-runs against open sync PRs.
            should_run=false
          else
            should_run=true
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "resume=$resume" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"
          echo "skip_agent=$skip_agent" >> "$GITHUB_OUTPUT"
          echo "agent_provider=$agent_provider" >> "$GITHUB_OUTPUT"
          echo "max_commits=$max_commits" >> "$GITHUB_OUTPUT"
          echo "min_releases=$min_releases" >> "$GITHUB_OUTPUT"
          echo "until_sha=$until_sha" >> "$GITHUB_OUTPUT"

  sync:
    name: Upstream sync harness
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions: write-all
    env:
      # Default GH_TOKEN for early steps. Fail-fast overrides GITHUB_ENV with a
      # validated PAT (required to push `.github/workflows/*` — GITHUB_TOKEN cannot).
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          # Clone with GITHUB_TOKEN so an expired PAT secret cannot break checkout.
          # persist-credentials:false — checkout@v6 otherwise keeps GITHUB_TOKEN auth in
          # $RUNNER_TEMP/git-credentials-*.config via includeIf; Fail-fast adding a second
          # Authorization header then fails git fetch/push with HTTP 400 "Duplicate header".
          token: ${{ github.token }}
          persist-credentials: false

      - name: Fail fast credentials
        env:
          SKIP_AGENT: ${{ needs.gate.outputs.skip_agent }}
          AGENT_PROVIDER: ${{ needs.gate.outputs.agent_provider }}
          CANDIDATE_GH_PAT: ${{ secrets.GH_PAT }}
          CANDIDATE_UPSTREAM_SYNC_GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_GH_TOKEN }}
          CANDIDATE_GITHUB_TOKEN: ${{ github.token }}
          HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          set -euo pipefail

          git config user.name "upstream-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Drop checkout@v6 includeIf credential files so we never send two Authorization headers.
          git config --local --unset-all http.https://github.com/.extraheader || true
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            git config --local --unset-all "$key" || true
          done < <(git config --local --name-only --get-regexp '^includeif\.gitdir:.*\.path$' || true)
          rm -f "${RUNNER_TEMP}"/git-credentials-*.config || true

          origin_url="$(git remote get-url origin)"
          origin_url="${origin_url#https://}"
          origin_url="${origin_url#*@}"
          git remote set-url origin "https://${origin_url}"

          configure_git_auth() {
            local token="$1"
            git config --local --unset-all http.https://github.com/.extraheader || true
            local basic_auth
            basic_auth="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${basic_auth}"
          }

          # API .permissions reflects the user role, not token scopes — prove write with a real
          # workflow-file push (GITHUB_TOKEN / read-only fine-grained PATs fail here).
          probe_workflow_push() {
            local token="$1"
            local source="$2"
            local login scopes_header probe_branch start_ref push_err
            [ -n "$token" ] || return 1

            if ! GH_TOKEN="$token" gh api "repos/${GITHUB_REPOSITORY}" --jq .full_name >/dev/null 2>&1; then
              echo "${source}: cannot read ${GITHUB_REPOSITORY}"
              return 1
            fi
            login="$(GH_TOKEN="$token" gh api user --jq .login 2>/dev/null || echo unknown)"
            scopes_header=$(GH_TOKEN="$token" gh api -i user 2>&1 | tr -d '\r' | grep -i '^x-oauth-scopes:' || true)
            if [ -n "$scopes_header" ] && ! echo "$scopes_header" | grep -qi 'workflow'; then
              echo "${source}: login=${login} missing workflow scope (${scopes_header})"
              return 1
            fi

            configure_git_auth "$token"
            probe_branch="upstream-sync/perm-probe-${GITHUB_RUN_ID}-${source}"
            start_ref="$(git rev-parse HEAD)"
            push_err="$(mktemp)"
            mkdir -p .github/workflows
            printf '# upstream-sync workflows permission probe\n' \
              > .github/workflows/.upstream-sync-perm-probe.yml
            git add .github/workflows/.upstream-sync-perm-probe.yml
            git commit --no-verify -m "chore: probe workflows push permission (${source})" >/dev/null

            if ! git push -u origin "HEAD:${probe_branch}" >"$push_err" 2>&1; then
              echo "${source}: login=${login} git push failed:"
              sed 's/^/  /' "$push_err" || true
              git push origin --delete "$probe_branch" >/dev/null 2>&1 || true
              git reset --hard "$start_ref" >/dev/null
              rm -f .github/workflows/.upstream-sync-perm-probe.yml "$push_err"
              return 1
            fi

            git push origin --delete "$probe_branch" >/dev/null 2>&1 || true
            git reset --hard "$start_ref" >/dev/null
            rm -f .github/workflows/.upstream-sync-perm-probe.yml "$push_err"
            echo "${source}: ok (login=${login}, workflow push verified)"
            return 0
          }

          selected_source=""
          selected_token=""
          rejection_notes=""

          for candidate in \
            "GH_PAT:${CANDIDATE_GH_PAT}" \
            "UPSTREAM_SYNC_GH_TOKEN:${CANDIDATE_UPSTREAM_SYNC_GH_TOKEN}"
          do
            source="${candidate%%:*}"
            token="${candidate#*:}"
            if [ -z "$token" ]; then
              rejection_notes="${rejection_notes}${source}: not set"$'\n'
              continue
            fi
            # Do not capture stdout — probe logs must stay visible on failure.
            if probe_workflow_push "$token" "$source"; then
              selected_source="$source"
              selected_token="$token"
              break
            fi
            rejection_notes="${rejection_notes}${source}: rejected"$'\n'
          done

          if [ -z "$selected_token" ]; then
            echo "::error::No usable push token for upstream-sync."
            echo "Tried GH_PAT then UPSTREAM_SYNC_GH_TOKEN."
            echo "Need a classic ghp_* with repo+workflow (or fine-grained Contents+Workflows write)"
            echo "from an account that can push to ${GITHUB_REPOSITORY}."
            echo "Note: API permissions.push can be true while the token still cannot git-push."
            printf '%s' "$rejection_notes"
            exit 1
          fi

          echo "GitHub token source: $selected_source"
          echo "GH_TOKEN=$selected_token" >> "$GITHUB_ENV"
          if [ "$selected_source" = "GH_PAT" ]; then
            echo "GH_PAT=$selected_token" >> "$GITHUB_ENV"
          else
            echo "UPSTREAM_SYNC_GH_TOKEN=$selected_token" >> "$GITHUB_ENV"
          fi
          configure_git_auth "$selected_token"

          if [ "$SKIP_AGENT" = "true" ]; then
            exit 0
          fi
          if [ "$AGENT_PROVIDER" = "openai" ]; then
            if [ "$HAS_OPENAI_API_KEY" != "true" ]; then
              echo "Missing OPENAI_API_KEY. Add it under Settings → Secrets → Actions."
              exit 1
            fi
          elif [ "$AGENT_PROVIDER" = "dual" ]; then
            missing=""
            if [ "$HAS_ANTHROPIC_API_KEY" != "true" ] && [ "$HAS_CLAUDE_CODE_OAUTH_TOKEN" != "true" ]; then
              missing="${missing}ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN) "
            fi
            if [ "$HAS_OPENAI_API_KEY" != "true" ]; then
              missing="${missing}OPENAI_API_KEY "
            fi
            if [ -n "$missing" ]; then
              echo "Dual mode needs both Anthropic (Opus parent) and OpenAI (Luna children). Missing: $missing"
              echo "Add under Settings → Secrets → Actions."
              exit 1
            fi
          elif [ "$HAS_ANTHROPIC_API_KEY" != "true" ] && [ "$HAS_CLAUDE_CODE_OAUTH_TOKEN" != "true" ]; then
            echo "Missing ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN. Add one under Settings → Secrets → Actions."
            exit 1
          fi

      - name: Snapshot harness (resume)
        if: needs.gate.outputs.resume == 'true'
        run: cp -a .sandcastle "$RUNNER_TEMP/upstream-sync-harness"

      - name: Checkout resume PR branch
        if: needs.gate.outputs.resume == 'true'
        id: resume_pr
        env:
          COMMENT_PR_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_PR_NUMBER: ${{ github.event.inputs.resume_pr }}
        run: |
          set -euo pipefail
          pr_number="${COMMENT_PR_NUMBER:-$DISPATCH_PR_NUMBER}"
          if [ -z "$pr_number" ]; then
            echo "resume=true requires resume_pr when using workflow_dispatch"
            exit 1
          fi
          # REST — `gh pr view` uses GraphQL and often fails with Actions GITHUB_TOKEN.
          branch=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq .head.ref)
          if [ -z "$branch" ] || [ "$branch" = "null" ]; then
            echo "::error::Could not resolve head.ref for PR #${pr_number}"
            exit 1
          fi
          echo "Resuming PR #${pr_number} on branch ${branch}"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Restore harness (resume)
        if: needs.gate.outputs.resume == 'true'
        run: cp -a "$RUNNER_TEMP/upstream-sync-harness/." .sandcastle/

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Configure git
        run: |
          git config user.name "upstream-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          remote="${{ env.UPSTREAM_REMOTE }}"
          if git remote get-url "$remote" >/dev/null 2>&1; then
            git remote set-url "$remote" "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          else
            git remote add "$remote" "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          fi
          git fetch "$remote" "${{ env.UPSTREAM_BRANCH }}"

      - name: Bootstrap package manager (resume)
        if: needs.gate.outputs.resume == 'true'
        run: bun .sandcastle/bootstrap-lockfile.ts ci-resume

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Claude Code CLI
        if: needs.gate.outputs.skip_agent != 'true' && (needs.gate.outputs.agent_provider == 'anthropic' || needs.gate.outputs.agent_provider == 'dual')
        run: bun add -g @anthropic-ai/claude-code

      - name: Install Codex CLI
        if: needs.gate.outputs.skip_agent != 'true' && (needs.gate.outputs.agent_provider == 'openai' || needs.gate.outputs.agent_provider == 'dual')
        run: bun add -g @openai/codex

      # Codex CLI 0.122+ ignores OPENAI_API_KEY env and requires $CODEX_HOME/auth.json.
      # Without this, child agents 401 on /v1/responses with "Missing bearer...".
      - name: Materialize Codex auth.json
        if: needs.gate.outputs.skip_agent != 'true' && (needs.gate.outputs.agent_provider == 'openai' || needs.gate.outputs.agent_provider == 'dual')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY secret is empty"
            exit 1
          fi
          export CODEX_HOME="${CODEX_HOME:-$HOME/.codex}"
          mkdir -p "$CODEX_HOME"
          chmod 700 "$CODEX_HOME"
          # Write via Python so the key is not exposed on the process argv.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          home = Path(os.environ['CODEX_HOME'])
          auth = home / 'auth.json'
          tmp = home / 'auth.json.tmp'
          tmp.write_text(json.dumps({'OPENAI_API_KEY': os.environ['OPENAI_API_KEY']}) + '\n')
          tmp.chmod(0o600)
          tmp.replace(auth)
          print(f'Wrote Codex apikey auth to {auth}')
          PY

      - name: Diagnose GitHub token
        run: |
          echo "::group::Diagnose GitHub token"
          if gh api user --jq '{login: .login, type: .type}' 2>/dev/null; then
            gh api -i user 2>&1 | grep -i '^x-oauth-scopes:' || echo "No x-oauth-scopes header (fine-grained PAT)"
          else
            echo "Token has no /user identity"
          fi
          gh api "repos/${GITHUB_REPOSITORY}" --jq '{full_name, permissions: .permissions}'
          echo "::endgroup::"

      - name: Run upstream sync harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # GH_TOKEN / GH_PAT come from Fail fast credentials via GITHUB_ENV.
          UPSTREAM_SYNC_AGENT: ${{ needs.gate.outputs.agent_provider }}
          UPSTREAM_SYNC_FORCE: ${{ needs.gate.outputs.force }}
          UPSTREAM_SYNC_RESUME: ${{ needs.gate.outputs.resume }}
          UPSTREAM_SYNC_SKIP_AGENT: ${{ needs.gate.outputs.skip_agent }}
          UPSTREAM_SYNC_MAX_COMMITS: ${{ needs.gate.outputs.max_commits }}
          UPSTREAM_SYNC_MIN_RELEASES: ${{ needs.gate.outputs.min_releases }}
          UPSTREAM_SYNC_UNTIL_SHA: ${{ needs.gate.outputs.until_sha }}
          # Hierarchical clusters: deeper prefixes + max files/leaf + dynamic leftover re-split.
          # Override via repo Variables if needed.
          UPSTREAM_SYNC_CLUSTER_MIN_SEGMENTS: ${{ vars.UPSTREAM_SYNC_CLUSTER_MIN_SEGMENTS || '4' }}
          UPSTREAM_SYNC_CLUSTER_MAX_FILES: ${{ vars.UPSTREAM_SYNC_CLUSTER_MAX_FILES || '12' }}
          UPSTREAM_SYNC_CLUSTER_MAX_DEPTH: ${{ vars.UPSTREAM_SYNC_CLUSTER_MAX_DEPTH || '5' }}
          UPSTREAM_SYNC_CLUSTER_MAX_DYNAMIC_ROUNDS: ${{ vars.UPSTREAM_SYNC_CLUSTER_MAX_DYNAMIC_ROUNDS || '2' }}
          RESUME_PR_NUMBER: ${{ steps.resume_pr.outputs.pr_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
        run: |
          set +e
          bun run upstream-sync
          status=$?
          exit $status

      # Always publish a detailed Summary tab (status, sync context, conflicts,
      # verification, agent usage) — including cancelled / failed runs.
      # Always publish the job Summary tab (status + full run cost) — even when
      # skip_agent / cancel / mid-merge — so dual Opus+Luna totals are never lost.
      - name: Publish run summary
        if: always()
        env:
          UPSTREAM_SYNC_JOB_STATUS: ${{ job.status }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          echo "::group::Publish run summary"
          bun .sandcastle/recover-usage.ts --commit || true
          branch=$(git branch --show-current 2>/dev/null || true)
          if [ -n "$branch" ] && [[ "$branch" == upstream-sync/* ]]; then
            if [ -f .git/MERGE_HEAD ]; then
              echo "Merge in progress — skipping usage commit (ledger left staged/uncommitted)"
            elif ! git diff --quiet HEAD -- .upstream-sync 2>/dev/null || \
               ! git diff --cached --quiet -- .upstream-sync 2>/dev/null; then
              git add .upstream-sync || true
              git diff --cached --quiet || git commit -m "upstream-sync: recover agent usage after cancel/error" || true
            fi
            git push origin "HEAD:refs/heads/${branch}" || echo "Could not push usage recovery to ${branch}"
          else
            echo "Not on an upstream-sync/* branch (${branch:-unknown}) — summary left in job Summary / artifacts"
          fi
          if ls .upstream-sync/ledger/*/usage.json >/dev/null 2>&1; then
            echo "usage.json present under .upstream-sync/ledger/"
          fi
          if ls .upstream-sync/ledger/*/outcome.json >/dev/null 2>&1; then
            echo "outcome.json present under .upstream-sync/ledger/"
          fi
          echo "::endgroup::"

      - name: Upload Sandcastle logs (if any)
        if: always()
        run: |
          echo "::group::Upload Sandcastle logs"
          if [ -d .sandcastle/logs ] && [ -n "$(ls -A .sandcastle/logs 2>/dev/null)" ]; then
            echo "has_logs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_logs=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::endgroup::"
        id: sandcastle_logs

      - name: Upload Sandcastle log artifact
        if: always() && steps.sandcastle_logs.outputs.has_logs == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandcastle-logs-${{ github.run_id }}
          path: .sandcastle/logs/
          retention-days: 14

      - name: Upload usage ledger artifact
        if: always()
        continue-on-error: true
